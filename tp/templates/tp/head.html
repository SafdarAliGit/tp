{# Shared <head> contents for every portal page #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2D5591">
<link rel="icon" type="image/svg+xml" href="{{ asset('images/favicon.svg') }}">
<title>{{ title | e }} · {{ app_name | e }}</title>
<script>
	/* Apply the saved theme before first paint to avoid a flash */
	(function () {
		try {
			var t = localStorage.getItem("tp-theme");
			if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
			if (localStorage.getItem("tp-sidebar") === "collapsed") document.documentElement.classList.add("sidebar-collapsed");
		} catch (e) {}
	})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
{% for css in ["css/tokens.css", "css/base.css", "css/components.css", "css/layout.css", "css/pages.css"] %}
<link rel="stylesheet" href="{{ asset(css) }}">
{% endfor %}
<script type="importmap">{{ import_map }}</script>
